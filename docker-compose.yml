# ArgoCD Dynamic Secret – Proof of Concept
#
# Architecture:
#   vault   – HashiCorp Vault (dev mode):
#              • OIDC Identity Provider (browser login to ArgoCD)
#              • AppRole auth endpoint (machine/client authentication)
#              • KV secret engine (stores the short-lived ArgoCD API token)
#   k3s     – Lightweight Kubernetes that runs ArgoCD
#   setup   – One-shot container:
#              • Configures Vault OIDC + AppRole + KV engine
#              • Installs + configures ArgoCD (OIDC + RBAC)
#              • Generates a short-lived ArgoCD API token and stores it in Vault KV
#   client  – One-shot container that demonstrates the dynamic-secret flow:
#              • Authenticates to Vault via AppRole (no static credentials)
#              • Reads the ArgoCD API token from Vault KV (the dynamic secret)
#              • Uses the token to create / update / sync / delete an ArgoCD application
#
# Quick-start:
#   docker compose up
#   docker compose logs -f client   # watch the dynamic-secret demo

services:

  # ── Vault ────────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    hostname: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "info"
    command: vault server -dev
    ports:
      - "8200:8200"
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Lightweight Kubernetes (hosts ArgoCD) ────────────────────────────────────
  k3s:
    image: rancher/k3s:v1.28.5-k3s1
    container_name: k3s
    hostname: k3s
    privileged: true
    restart: unless-stopped
    command: server --disable=traefik --tls-san=k3s --tls-san=localhost
    environment:
      K3S_KUBECONFIG_OUTPUT: "/k3s-output/kubeconfig.yaml"
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-output:/k3s-output
      - k3s-server:/var/lib/rancher/k3s
      - k3s-cni:/var/lib/cni
    ports:
      - "6443:6443"   # Kubernetes API server
      - "8080:30080"  # ArgoCD UI (NodePort → host)
    networks:
      - poc-network
    healthcheck:
      test: ["CMD-SHELL", "k3s kubectl get nodes 2>/dev/null | grep -q ' Ready'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ── One-time setup ────────────────────────────────────────────────────────────
  setup:
    image: alpine:3.19
    container_name: setup
    depends_on:
      vault:
        condition: service_healthy
      k3s:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      K3S_HOST: "k3s"
      ARGOCD_VERSION: "v2.9.3"
      ARGOCD_NAMESPACE: "argocd"
      # Redirect URI must match what the user's browser resolves.
      # http://localhost:8080 is where ArgoCD is exposed on the host.
      ARGOCD_REDIRECT_URI: "http://localhost:8080/auth/callback"
      ARGOCD_URL: "http://localhost:8080"
    volumes:
      - k3s-output:/k3s-output:ro
      - ./scripts:/scripts:ro
      - ./configs:/configs:ro
      - setup-output:/setup-output
    command: ["/bin/sh", "/scripts/setup.sh"]
    networks:
      - poc-network

  # ── Client (dynamic-secret consumer) ────────────────────────────────────────
  # Represents any automated system that needs ArgoCD API access.
  # It holds NO static ArgoCD credentials – it fetches a short-lived token
  # from Vault on every run:
  #   1. AppRole login  → short-lived Vault token
  #   2. Read Vault KV  → ArgoCD API token (the dynamic secret)
  #   3. Call ArgoCD    → create / update / sync / delete application
  client:
    image: alpine:3.19
    container_name: client
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "http://vault:8200"
      K3S_HOST: "k3s"
      ARGOCD_NAMESPACE: "argocd"
    volumes:
      - k3s-output:/k3s-output:ro
      - setup-output:/setup-output:ro
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/client.sh"]
    networks:
      - poc-network

volumes:
  k3s-output:
  k3s-server:
  k3s-cni:
  setup-output:

networks:
  poc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
